<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ほしいもの — スポンサー募集リスト</title>
<meta name="description" content="本当に大切なものだけを並べた、公開ほしいものリスト。¥500から応援できます。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ほしいもの">
<meta property="og:title" content="ほしいものリスト — 応援してね">
<meta property="og:description" content="本当に大切なものだけを並べた、公開ほしいものリスト。¥500から応援できます。">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="ほしいものリスト — 応援してね">
<meta name="twitter:description" content="本当に大切なものだけを並べた、公開ほしいものリスト。¥500から応援できます。">
<style>
  :root{
    --bg:#F7F5F2; --surface:#FFFFFF; --surface-2:#F1ECE7;
    --ink:#1F1A24; --muted:#7A7280; --line:#E4DED8;
    --accent:#1F1A24; --on-accent:#FFFFFF;
    --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#16131A; --surface:#1C1922; --surface-2:#241F2B;
      --ink:#F2EFF4; --muted:#948D9C; --line:#322D3A;
      --accent:#F2EFF4; --on-accent:#16131A;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--sans); color:var(--ink); background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  .page{max-width:660px; margin:0 auto; padding:0 22px 64px}
  .eyebrow{font-size:11px; font-weight:600; letter-spacing:.28em; color:var(--muted)}

  .state{padding:96px 0; text-align:center; color:var(--muted); font-size:14px}
  .state .big{font-family:var(--serif); font-size:20px; color:var(--ink); margin-bottom:8px}

  .masthead{padding:52px 0 30px; border-bottom:1px solid var(--line)}
  .masthead h1{font-family:var(--serif); font-weight:500; font-size:34px; line-height:1.34; margin:18px 0 26px; letter-spacing:.01em}
  .owner{display:flex; align-items:center; gap:12px; margin-bottom:22px}
  .avatar{width:44px; height:44px; border-radius:50%; background:var(--surface-2); border:1px solid var(--line);
    display:grid; place-items:center; font-family:var(--serif); font-size:18px; color:var(--ink); flex:none}
  .owner .who{display:flex; flex-direction:column; gap:2px}
  .owner .name{font-size:15px; font-weight:700}
  .owner .handle{font-size:12.5px; color:var(--muted)}
  .lede{font-family:var(--serif); font-size:16.5px; line-height:1.95; color:var(--ink); margin:0 0 22px}
  .explain{font-size:12.5px; line-height:1.7; color:var(--muted); padding:12px 14px; border:1px solid var(--line); border-radius:8px}
  .explain b{color:var(--ink); font-weight:700}

  .items{display:flex; flex-direction:column}
  .item{padding:34px 0; border-bottom:1px solid var(--line)}
  .plate{width:100%; aspect-ratio:16/10; background:var(--surface-2); border:1px solid var(--line);
    border-radius:8px; overflow:hidden; display:grid; place-items:center; margin-bottom:20px}
  .plate svg{width:42%; height:42%; color:var(--ink); opacity:.72}
  .brand{font-size:11px; font-weight:700; letter-spacing:.14em; color:var(--ink)}
  .item h2{font-family:var(--serif); font-weight:500; font-size:22px; line-height:1.4; margin:7px 0 0; letter-spacing:.01em}
  .price{font-size:15px; font-weight:700; margin-top:10px; font-variant-numeric:tabular-nums}
  .story{font-family:var(--serif); font-size:14.5px; line-height:1.95; color:var(--muted);
    margin:14px 0 16px; padding-left:14px; border-left:2px solid var(--line)}
  .rowlink{display:inline-block; font-size:12.5px; font-weight:600; color:var(--muted); text-decoration:none; margin-bottom:16px}
  .rowlink:hover{color:var(--ink)}
  .goal{font-size:12px; color:var(--muted); margin-bottom:16px; font-variant-numeric:tabular-nums}
  .goal b{color:var(--ink); font-weight:700}
  .gauge{margin-bottom:16px}
  .gauge .track{height:3px; background:var(--line); border-radius:2px; overflow:hidden}
  .gauge .fill{height:100%; background:var(--ink)}
  .gauge .stat{display:flex; justify-content:space-between; align-items:baseline; margin-top:9px; font-size:12px; color:var(--muted); gap:10px}
  .gauge .stat .raised{color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums}
  .support{display:inline-flex; align-items:center; gap:8px; font-family:var(--sans); font-size:14px; font-weight:700;
    cursor:pointer; background:var(--accent); color:var(--on-accent); border:0; padding:12px 20px; border-radius:8px}
  .support .amt{font-weight:600; opacity:.8; font-size:12.5px}
  .support:active{transform:translateY(1px)}
  .support[disabled]{background:transparent; color:var(--muted); border:1px solid var(--line); cursor:default}
  .support[disabled]:active{transform:none}

  footer{padding-top:36px; text-align:center; color:var(--muted)}
  footer .mark{font-family:var(--serif); font-size:15px; color:var(--ink)}
  footer .note{font-size:11.5px; margin-top:8px; line-height:1.7}
  footer .legal{display:flex; flex-wrap:wrap; justify-content:center; gap:8px 18px; margin-top:14px}
  footer .legal a{font-size:11.5px; color:var(--muted); text-decoration:none; border-bottom:1px solid var(--line)}
  footer .legal a:hover{color:var(--ink)}

  .sharebar{margin-top:18px}
  .sharelabel{font-size:11px; font-weight:600; letter-spacing:.12em; color:var(--muted); display:block; margin-bottom:8px}
  .sharebtns{display:flex; gap:8px; flex-wrap:wrap}
  .sbtn{font-family:var(--sans); font-size:12.5px; font-weight:700; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:8px; padding:9px 14px; cursor:pointer; text-decoration:none; display:inline-block}
  .sbtn:active{transform:translateY(1px)}

  /* sheet */
  .scrim{position:fixed; inset:0; background:rgba(15,12,20,.5); opacity:0; pointer-events:none; transition:opacity .25s; z-index:40}
  .scrim.open{opacity:1; pointer-events:auto}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:41; max-width:660px; margin:0 auto; background:var(--bg);
    border-radius:18px 18px 0 0; border-top:1px solid var(--line); padding:8px 22px calc(26px + env(safe-area-inset-bottom));
    transform:translateY(101%); transition:transform .3s cubic-bezier(.2,.8,.2,1); max-height:92vh; overflow-y:auto}
  .sheet.open{transform:translateY(0)}
  .grip{width:38px; height:4px; border-radius:2px; background:var(--line); margin:8px auto 16px}
  .sheet h3{font-family:var(--serif); font-weight:500; font-size:19px; margin:6px 0 22px; line-height:1.45}
  .flabel{font-size:11px; font-weight:600; letter-spacing:.12em; color:var(--muted); margin-bottom:10px}
  .amounts{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px}
  .amount{font-family:var(--sans); font-size:15px; font-weight:700; cursor:pointer; padding:13px 6px; border-radius:8px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink); text-align:center; font-variant-numeric:tabular-nums}
  .amount.sel{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
  .custom{display:flex; align-items:center; gap:6px; margin-bottom:22px; border:1px solid var(--line); border-radius:8px; padding:0 14px; background:var(--surface)}
  .custom.sel{border-color:var(--accent)}
  .custom span{color:var(--muted); font-size:15px}
  .custom input{flex:1; border:0; background:transparent; color:var(--ink); font-size:16px; font-family:var(--sans); padding:13px 0; outline:none; font-variant-numeric:tabular-nums}
  .msg{width:100%; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink);
    font-family:var(--sans); font-size:15px; padding:12px 14px; outline:none; resize:none; margin-bottom:22px; line-height:1.6}
  .confirm{width:100%; font-family:var(--sans); font-size:15px; font-weight:700; cursor:pointer; background:var(--accent);
    color:var(--on-accent); border:0; padding:16px; border-radius:10px}
  .confirm:active{transform:translateY(1px)}
  .terms-note{font-size:11px; line-height:1.75; color:var(--muted); margin:12px 0 0}
  .terms-note a{color:var(--muted)}
  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg);
    font-size:13px; font-weight:600; padding:12px 18px; border-radius:999px; opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; z-index:50; max-width:88vw; text-align:center}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="page"><div id="content">
    <div class="state"><div class="big">読み込み中…</div></div>
  </div></div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="grip"></div>
    <div class="eyebrow">SUPPORT</div>
    <h3 id="sheetItem">この一点を応援する</h3>
    <div class="flabel">金額をえらぶ</div>
    <div class="amounts" id="amounts">
      <button class="amount" data-amt="500">¥500</button>
      <button class="amount sel" data-amt="1000">¥1,000</button>
      <button class="amount" data-amt="3000">¥3,000</button>
      <button class="amount" data-amt="5000">¥5,000</button>
      <button class="amount" data-amt="10000">¥10,000</button>
      <button class="amount" data-amt="30000">¥30,000</button>
    </div>
    <div class="custom" id="customWrap"><span>¥</span><input id="customAmt" inputmode="numeric" placeholder="自由に入力"></div>
    <div class="flabel">お名前（任意）</div>
    <input class="msg" id="supName" placeholder="ニックネーム">
    <div class="flabel">メッセージ（任意）</div>
    <textarea class="msg" id="msg" rows="2" placeholder="応援メッセージを添える…"></textarea>
    <button class="confirm" id="confirm">¥1,000 を応援する</button>
    <p class="terms-note">
      応援は決済完了後のキャンセル・返金ができません。当方は手数料をいただきません。
      応援額は持ち主の口座に直接お支払いします。お進みになると
      <a href="terms.html" target="_blank" rel="noopener">利用規約</a>・<a href="privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a>に同意したものとみなします。
    </p>
  </div>
  <div class="toast" id="toast"></div>

<script>
  var SUPA_URL = "https://cdhgautowslocnudstjs.supabase.co";
  var KEY = "sb_publishable_LyHqrKcgC7U79-zO6eOtJA_SlFUkloQ";

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
  function yen(n){ return "¥" + Number(n||0).toLocaleString("en-US"); }

  function svgFor(cat){
    var c = cat || "";
    if(/シューズ|靴|スニーカー/.test(c)) return '<svg viewBox="0 0 100 60" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 40 C14 30 18 27 26 27 C33 27 36 31 44 33 C57 36 70 35 82 40 C88 42 90 44 88 46 L16 46 C12 46 11 43 12 40 Z"/><path d="M26 27 C27 31 29 33 33 34"/><path d="M34 30 L40 32 M39 28 L44 31 M45 27 L49 30"/></svg>';
    if(/アウター|コート|ジャケット|ワンピース|トップス|ボトムス/.test(c)) return '<svg viewBox="0 0 100 60" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M38 12 L50 18 L62 12 L70 17 L64 24 L64 50 L36 50 L36 24 L30 17 Z"/><path d="M50 18 L50 34"/><path d="M46 40 L46 46 M54 40 L54 46"/></svg>';
    if(/バッグ|かばん/.test(c)) return '<svg viewBox="0 0 100 60" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M32 24 L68 24 L72 50 L28 50 Z"/><path d="M40 24 C40 16 46 14 50 14 C54 14 60 16 60 24"/></svg>';
    if(/アクセ|時計|ウォッチ|リング|ピアス|指輪/.test(c)) return '<svg viewBox="0 0 100 60" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="34" r="12"/><path d="M42 24 L46 14 L54 14 L58 24"/></svg>';
    return '<svg viewBox="0 0 100 60" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M50 14 L64 24 L58 46 L42 46 L36 24 Z"/></svg>';
  }

  function shareBar(d){
    var url = encodeURIComponent(location.href);
    var text = encodeURIComponent((d.owner || '') + 'のほしいものリスト｜応援してね');
    return '<div class="sharebar"><span class="sharelabel">このリストを広める</span>'+
      '<div class="sharebtns">'+
        '<a class="sbtn" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text='+text+'&url='+url+'">Xでシェア</a>'+
        '<a class="sbtn" target="_blank" rel="noopener" href="https://social-plugins.line.me/lineit/share?url='+url+'">LINE</a>'+
        '<button class="sbtn" id="nativeShare">その他</button>'+
        '<button class="sbtn" id="copyLink">リンクをコピー</button>'+
      '</div></div>';
  }
  function copyLink(){
    if(navigator.clipboard){ navigator.clipboard.writeText(location.href).then(function(){ toastShow('リンクをコピーしました'); }); }
    else { toastShow(location.href); }
  }
  function bindShare(){
    var n = document.getElementById('nativeShare');
    if(n){ n.addEventListener('click', function(){
      if(navigator.share){ navigator.share({ title:'ほしいものリスト', url:location.href }).catch(function(){}); }
      else { copyLink(); }
    }); }
    var c = document.getElementById('copyLink');
    if(c){ c.addEventListener('click', copyLink); }
  }

  function showState(big, small){
    document.getElementById('content').innerHTML =
      '<div class="state"><div class="big">'+esc(big)+'</div>'+(small?esc(small):'')+'</div>';
  }

  function render(d, tips, accepting){
    tips = tips || [];
    var agg = {};
    tips.forEach(function(t){
      var k = t.item_name || '';
      if(!agg[k]) agg[k] = { sum:0, count:0 };
      agg[k].sum += Number(t.amount) || 0;
      agg[k].count += 1;
    });

    var items = (d.items||[]).map(function(it){
      var a = agg[it.name] || { sum:0, count:0 };
      var pct = it.price>0 ? Math.min(100, Math.round(a.sum / it.price * 100)) : (a.sum>0 ? 100 : 0);
      var gauge = '<div class="gauge"><div class="track"><div class="fill" style="width:'+pct+'%"></div></div>'+
        '<div class="stat"><span><span class="raised">'+yen(a.sum)+'</span> 集まっています</span>'+
        '<span>'+(it.price>0 ? ('目標 '+yen(it.price)+' ・ ') : '')+a.count+'人が応援</span></div></div>';
      return '<article class="item">'+
        '<div class="plate">'+svgFor(it.category)+'</div>'+
        (it.brand ? '<div class="brand">'+esc(String(it.brand).toUpperCase())+'</div>' : '')+
        '<h2>'+esc(it.name)+'</h2>'+
        (it.price>0 ? '<div class="price">'+yen(it.price)+'</div>' : '')+
        (it.story ? '<p class="story">'+esc(it.story).replace(/\n/g,'<br>')+'</p>' : '')+
        (/^https?:\/\//.test(it.url||'') ? '<a class="rowlink" href="'+esc(it.url)+'" target="_blank" rel="noopener noreferrer">商品ページ ↗</a><br>' : '')+
        gauge+
        (accepting
          ? '<button class="support" data-item="'+esc(it.name)+'">この一点を応援する <span class="amt">¥500〜</span></button>'
          : '<button class="support" disabled>応援の受付は準備中です</button>')+
      '</article>';
    }).join('');

    var initial = (d.owner||'?').trim().charAt(0) || '?';
    document.getElementById('content').innerHTML =
      '<header class="masthead">'+
        '<div class="eyebrow">SPONSOR LIST</div>'+
        '<h1>背伸びした、<br>本当に欲しいもの。</h1>'+
        '<div class="owner"><div class="avatar">'+esc(initial)+'</div>'+
          '<div class="who"><span class="name">'+esc(d.owner||'匿名')+'</span>'+
          (d.handle ? '<span class="handle">'+esc(d.handle)+'</span>' : '')+'</div></div>'+
        (d.intro ? '<p class="lede">'+esc(d.intro).replace(/\n/g,'<br>')+'</p>' : '')+
        '<div class="explain">'+
          (accepting
            ? 'このリストは <b>¥500</b> から、メッセージを添えて応援できます。集まったぶんは、その一点のために。<br><br>応援は持ち主の口座に直接お届けします（決済は Stripe。当方の手数料はありません）。'
            : 'このリストは現在、応援を受け付けていません。持ち主が受け取りの準備を終えると応援できるようになります。')+
        '</div>'+
        shareBar(d)+
      '</header>'+
      '<main class="items">'+items+'</main>'+
      '<footer><div class="mark">ほしいもの</div>'+
      '<div class="legal">'+
        '<a href="tokushoho.html">特定商取引法に基づく表記</a>'+
        '<a href="terms.html">利用規約</a>'+
        '<a href="privacy.html">プライバシーポリシー</a>'+
      '</div>'+
      '<div class="note">物欲と向き合い、本当に大切なものを見極めるためのリスト。<br>※現在はテスト環境です（実際の課金は行われません）。</div></footer>';

    bindSupport();
    bindShare();
  }

  /** slug を引数で渡す RPC を叩く。失敗しても表示は続けたいので fallback を返す。 */
  function rpc(name, slug, fallback){
    return fetch(SUPA_URL+'/rest/v1/rpc/'+name, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', apikey:KEY, Authorization:'Bearer '+KEY },
      body: JSON.stringify({ p_slug: slug })
    }).then(function(r){ return r.ok ? r.json() : fallback; })
      .catch(function(){ return fallback; });
  }

  function load(){
    var slug = new URLSearchParams(location.search).get('slug');
    if(!slug){ showState('リストが指定されていません', 'アプリから公開したリンクを開いてください。'); return; }
    var h = { apikey:KEY, Authorization:'Bearer '+KEY };
    Promise.all([
      fetch(SUPA_URL+'/rest/v1/public_lists?slug=eq.'+encodeURIComponent(slug)+'&select=data', { headers:h }).then(function(r){ return r.json(); }),
      // 集計と受け取り可否は RPC で取る。ビュー（tips_public）を直接読ませると
      // anon が list_slug を全件引けてしまい、slug が漏れて他人のリストが読めるため。
      rpc('list_tips', slug, []),
      rpc('list_accepting', slug, false)
    ]).then(function(res){
      var rows = res[0], tips = res[1] || [], accepting = res[2] === true;
      if(!rows || !rows.length){ showState('リストが見つかりません', 'リンクが変更・削除された可能性があります。'); return; }
      render(rows[0].data || {}, tips, accepting);
    })
    .catch(function(){ showState('読み込みに失敗しました', '通信環境を確認して再度お試しください。'); });
  }

  // support sheet (mock)
  var toast=document.getElementById('toast'), timer;
  var scrim=document.getElementById('scrim'), sheet=document.getElementById('sheet');
  var amounts=document.getElementById('amounts'), customWrap=document.getElementById('customWrap');
  var customAmt=document.getElementById('customAmt'), confirmBtn=document.getElementById('confirm');
  var sheetItem=document.getElementById('sheetItem'), msg=document.getElementById('msg');
  var nameInput=document.getElementById('supName');
  var current=1000, curItem='', chips=Array.prototype.slice.call(amounts.children);
  function updateConfirm(){ confirmBtn.textContent = yen(current)+' を応援する'; }
  function toastShow(t){ toast.textContent=t; toast.classList.add('show'); clearTimeout(timer); timer=setTimeout(function(){toast.classList.remove('show');},2800); }
  function openSheet(name){
    curItem=name; sheetItem.textContent='「'+name+'」を応援する';
    current=1000; customAmt.value=''; customWrap.classList.remove('sel'); msg.value=''; nameInput.value='';
    chips.forEach(function(b){ b.classList.toggle('sel', b.getAttribute('data-amt')==='1000'); });
    updateConfirm(); scrim.classList.add('open'); sheet.classList.add('open'); document.body.style.overflow='hidden';
  }
  function closeSheet(){ scrim.classList.remove('open'); sheet.classList.remove('open'); document.body.style.overflow=''; }
  function bindSupport(){
    document.querySelectorAll('.support').forEach(function(btn){
      btn.addEventListener('click', function(){ openSheet(btn.getAttribute('data-item')); });
    });
  }
  scrim.addEventListener('click', closeSheet);
  chips.forEach(function(b){ b.addEventListener('click', function(){
    chips.forEach(function(x){x.classList.remove('sel');});
    b.classList.add('sel'); customWrap.classList.remove('sel'); customAmt.value='';
    current=parseInt(b.getAttribute('data-amt'),10); updateConfirm();
  });});
  customAmt.addEventListener('input', function(){
    var v=parseInt(customAmt.value.replace(/[^0-9]/g,''),10)||0;
    chips.forEach(function(x){x.classList.remove('sel');});
    customWrap.classList.add('sel'); current=v; updateConfirm();
  });
  confirmBtn.addEventListener('click', function(){
    if(!current || current<100){ toastShow('¥100以上を選んでください'); return; }
    var slug = new URLSearchParams(location.search).get('slug');
    if(!slug){ toastShow('リストが特定できません'); return; }
    confirmBtn.disabled = true; confirmBtn.textContent = '処理中…';
    fetch(SUPA_URL + '/functions/v1/create-checkout', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', apikey:KEY, Authorization:'Bearer '+KEY },
      body: JSON.stringify({
        slug: slug, item_name: curItem, amount: current,
        message: msg.value.trim(), supporter_name: nameInput.value.trim()
      })
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.url){ location.href = d.url; }
      else { toastShow((d && d.error) ? d.error : 'エラーが発生しました'); confirmBtn.disabled=false; updateConfirm(); }
    })
    .catch(function(){ toastShow('通信に失敗しました'); confirmBtn.disabled=false; updateConfirm(); });
  });

  load();
  if(new URLSearchParams(location.search).get('thanks')){
    setTimeout(function(){ toastShow('応援ありがとうございました！ 🙏'); }, 900);
  }
</script>
</body>
</html>
